[package]
name = "jbig2-rs"
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure Rust JBIG2 decoder for images and PDFs"
keywords = ["jbig2", "image", "decoder", "pdf"]
categories = ["multimedia::images", "encoding"]
repository = "https://github.com/juancarlosmaggi/jbig2-rs"
homepage = "https://github.com/juancarlosmaggi/jbig2-rs"
documentation = "https://docs.rs/jbig2-rs"
readme = "README.md"

[features]
default = []
cli = ["dep:clap", "image-export"]
ffi = []
image-export = ["dep:image"]

[dependencies]
clap = { version = "4.0", features = ["derive"], optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[lib]
bench = false
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "jbig2-rs"
bench = false
required-features = ["cli"]

[[example]]
name = "process_test_resources"
required-features = ["image-export"]

[dev-dependencies]
rstest = "0.18"
criterion = "0.5"
proptest = "1.4"
sha1 = "0.10"

[[bench]]
name = "bitmap_bench"
harness = false

[[bench]]
name = "decoder_bench"
harness = false

[[bench]]
name = "full_bench"
harness = false

[[bench]]
name = "mmr_bench"
harness = false

[[bench]]
name = "generic_bench"
harness = false
[[bench]]
name = "mmr_mode_bench"
harness = false

[[bench]]
name = "reader_bench"
harness = false

[[bench]]
name = "uncompressed_bench"
harness = false

[[bench]]
name = "huffman_bench"
harness = false

[[bench]]
name = "generic_no_skip_bench"
harness = false
[[bench]]
name = "skip_loop_bench"
harness = false
