[package]
name = "jbig2-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Pure Rust JBIG2 decoder for images and PDFs"
keywords = ["jbig2", "image", "decoder", "pdf"]
categories = ["multimedia::images", "encoding"]

[dependencies]
clap = { version = "4.0", features = ["derive"] }
image = "0.24"

[dev-dependencies]
rstest = "0.18"
criterion = "0.5"

[[bench]]
name = "bitmap_bench"
harness = false

[[bench]]
name = "decoder_bench"
harness = false

[[bench]]
name = "full_bench"
harness = false
